<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="-10 -10 1120 580"><defs><filter id="shadow" x="-4%" y="-4%" width="112%" height="112%"><feFlood flood-color="#000000" flood-opacity="0.08" result="color"/><feComposite in="color" in2="SourceGraphic" operator="in" result="shadow"/><feGaussianBlur in="shadow" stdDeviation="3" result="blur"/><feOffset in="blur" dx="2" dy="3" result="offsetBlur"/><feMerge><feMergeNode in="offsetBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="shadow-light" x="-4%" y="-4%" width="112%" height="112%"><feFlood flood-color="#000000" flood-opacity="0.04" result="color"/><feComposite in="color" in2="SourceGraphic" operator="in" result="shadow"/><feGaussianBlur in="shadow" stdDeviation="2" result="blur"/><feOffset in="blur" dx="1" dy="2" result="offsetBlur"/><feMerge><feMergeNode in="offsetBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="-10" y="-10" width="1120" height="580" fill="#ffffff" rx="8"/><g id="layer-zones"><rect x="56" y="76" width="470" height="420" fill="#E3EDFA" rx="10"/><rect x="592" y="76" width="452" height="420" fill="#E8F5F5" rx="10"/></g><g id="layer-connectors"><line x1="534" y1="286" x2="570" y2="286" stroke="#8A93A8" stroke-width="1.8"/><polygon points="580,286 568,280 568,292" fill="#8A93A8"/><line x1="640" y1="452" x2="996" y2="452" stroke="#BEDCDC" stroke-width="1" stroke-dasharray="4,3"/></g><g id="layer-boxes"><g filter="url(#shadow-light)"><rect x="76" y="136" width="330" height="54" fill="#FFFFFF" stroke="#D4DEEE" stroke-width="1" rx="6"/></g><rect x="76" y="136" width="4" height="54" fill="#2A5FA4" rx="2"/><rect x="420" y="156" width="63" height="8" fill="#9FB6D9" rx="2"/><g filter="url(#shadow-light)"><rect x="76" y="204" width="330" height="54" fill="#FFFFFF" stroke="#D4DEEE" stroke-width="1" rx="6"/></g><rect x="76" y="204" width="4" height="54" fill="#2A5FA4" rx="2"/><rect x="420" y="224" width="50.4" height="8" fill="#9FB6D9" rx="2"/><g filter="url(#shadow-light)"><rect x="76" y="272" width="330" height="54" fill="#FFFFFF" stroke="#D4DEEE" stroke-width="1" rx="6"/></g><rect x="76" y="272" width="4" height="54" fill="#2A5FA4" rx="2"/><rect x="420" y="292" width="25.2" height="8" fill="#9FB6D9" rx="2"/><g filter="url(#shadow-light)"><rect x="76" y="340" width="330" height="54" fill="#FFFFFF" stroke="#D4DEEE" stroke-width="1" rx="6"/></g><rect x="76" y="340" width="4" height="54" fill="#2A5FA4" rx="2"/><rect x="420" y="360" width="8.4" height="8" fill="#9FB6D9" rx="2"/><g filter="url(#shadow-light)"><rect x="76" y="408" width="330" height="54" fill="#FFFFFF" stroke="#D4DEEE" stroke-width="1" rx="6"/></g><rect x="76" y="408" width="4" height="54" fill="#8B5FA0" rx="2"/><rect x="420" y="428" width="8.4" height="8" fill="#C9B8D6" rx="2"/><g filter="url(#shadow-light)"><rect x="612" y="136" width="412" height="50" fill="#FFFFFF" stroke="#BEDCDC" stroke-width="1" rx="6"/></g><rect x="612" y="136" width="4" height="50" fill="#2E8B8B" rx="2"/><g filter="url(#shadow-light)"><rect x="612" y="198" width="412" height="50" fill="#FFFFFF" stroke="#BEDCDC" stroke-width="1" rx="6"/></g><rect x="612" y="198" width="4" height="50" fill="#2E8B8B" rx="2"/><g filter="url(#shadow-light)"><rect x="612" y="260" width="412" height="50" fill="#FFFFFF" stroke="#BEDCDC" stroke-width="1" rx="6"/></g><rect x="612" y="260" width="4" height="50" fill="#2E8B8B" rx="2"/><g filter="url(#shadow)"><rect x="612" y="328" width="412" height="46" fill="#2E8B8B" rx="6"/></g></g><g id="layer-text"><text x="550" y="36" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2D3142" letter-spacing="1.2">WHAT THE COMMANDER SEES, AND WHAT IT EMITS</text><text x="550" y="56" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#999">domain-level only — no per-application features anywhere in the observation</text><text x="506" y="98" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="600" fill="#2A5FA4" letter-spacing="0.6" opacity="0.65">OBSERVATION  ·  per 60s tick</text><text x="430" y="120" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#9BA0B2" letter-spacing="0.5">STALENESS</text><text x="94" y="158" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">Per-domain health</text><text x="94" y="174" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">RPS, delta, accel, pods, CPU, throttle, p99</text><text x="420" y="178" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#8A93A8">30–150s</text><text x="94" y="226" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">Cross-domain graph</text><text x="94" y="242" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">call-rate matrix, latency exposure</text><text x="420" y="246" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#8A93A8">60–120s</text><text x="94" y="294" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">Cluster globals</text><text x="94" y="310" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">free CPU, nodes, pending, cost, calendar</text><text x="420" y="314" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#8A93A8">fresher</text><text x="94" y="362" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">Action history</text><text x="94" y="378" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">prev allocation, utilization, thrash</text><text x="420" y="382" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#8A93A8">own state</text><text x="94" y="430" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">Forecast injection</text><text x="94" y="446" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">3 horizons + uncertainty, per domain</text><text x="420" y="450" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#8A93A8">future</text><text x="291" y="480" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#7A8296">the present arrives late; the future arrives on time</text><text x="557" y="272" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#9BA0B2">policy</text><text x="1024" y="98" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="600" fill="#2E8B8B" letter-spacing="0.6" opacity="0.65">ACTION  ·  (D+1) softmax</text><text x="630" y="157" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">domain_budget_pct[5]</text><text x="630" y="173" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">share of allocatable CPU, general-purpose pools</text><text x="630" y="219" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">scale_urgency[5]</text><text x="630" y="235" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">speed-over-efficiency signal the Soldiers read</text><text x="630" y="281" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">headroom_pct[5]</text><text x="630" y="297" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">buffer above demand, inside the forecast horizon</text><text x="818" y="348" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#FFF">+ reserve dimension</text><text x="818" y="364" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="rgba(255,255,255,0.8)">the softmax slot for "I do not know where the next spike is"</text><text x="818" y="400" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5A6478">dead-zone filter: sub-2% changes snap to previous</text><text x="818" y="416" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">residual absorbed into reserve — so there are no ramps,</text><text x="818" y="432" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">only staircases</text><text x="818" y="474" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#3D7A5E">Soldiers patch HPA minReplicas and maxReplicas from this</text><text x="550" y="524" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="500" fill="#999">Five domain shares plus a reserve, summing to one — no replica count anywhere in the output</text><text x="550" y="541" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#BBB">~130-dimensional observation  |  16-dimensional action  |  60s tick</text></g></svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="-10 -10 1120 560"><defs><filter id="shadow" x="-4%" y="-4%" width="112%" height="112%"><feFlood flood-color="#000000" flood-opacity="0.08" result="color"/><feComposite in="color" in2="SourceGraphic" operator="in" result="shadow"/><feGaussianBlur in="shadow" stdDeviation="3" result="blur"/><feOffset in="blur" dx="2" dy="3" result="offsetBlur"/><feMerge><feMergeNode in="offsetBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="shadow-light" x="-4%" y="-4%" width="112%" height="112%"><feFlood flood-color="#000000" flood-opacity="0.04" result="color"/><feComposite in="color" in2="SourceGraphic" operator="in" result="shadow"/><feGaussianBlur in="shadow" stdDeviation="2" result="blur"/><feOffset in="blur" dx="1" dy="2" result="offsetBlur"/><feMerge><feMergeNode in="offsetBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="-10" y="-10" width="1120" height="560" fill="#ffffff" rx="8"/><g id="layer-zones"/><g id="layer-connectors"><line x1="232" y1="98" x2="232" y2="452" stroke="#EFF1F5" stroke-width="1"/><line x1="364" y1="98" x2="364" y2="452" stroke="#EFF1F5" stroke-width="1"/><line x1="496" y1="98" x2="496" y2="452" stroke="#EFF1F5" stroke-width="1"/><line x1="628" y1="98" x2="628" y2="452" stroke="#EFF1F5" stroke-width="1"/><line x1="760" y1="98" x2="760" y2="452" stroke="#EFF1F5" stroke-width="1"/><line x1="892" y1="98" x2="892" y2="452" stroke="#EFF1F5" stroke-width="1"/><line x1="496" y1="114" x2="496" y2="424" stroke="#2A5FA4" stroke-width="1.2" stroke-dasharray="4,3"/><line x1="496" y1="424" x2="892" y2="424" stroke="#C05A45" stroke-width="1.5"/><polygon points="892,424 883,420 883,428" fill="#C05A45"/></g><g id="layer-boxes"><rect x="232" y="114" width="264" height="24" fill="#2A5FA4" rx="4" opacity="0.9"/><rect x="232" y="168" width="66" height="24" fill="#C05A45" rx="4" opacity="0.8"/><rect x="232" y="244" width="396" height="24" fill="#8A5FA4" rx="4" opacity="0.75"/><rect x="628" y="244" width="66" height="24" fill="#C05A45" rx="4" opacity="0.85"/><rect x="232" y="296" width="396" height="24" fill="#8A5FA4" rx="4" opacity="0.75"/><rect x="628" y="296" width="132" height="24" fill="#C05A45" rx="4" opacity="0.85"/><rect x="232" y="348" width="396" height="24" fill="#8A5FA4" rx="4" opacity="0.75"/><rect x="628" y="348" width="198" height="24" fill="#C05A45" rx="4" opacity="0.85"/><g filter="url(#shadow)"><rect x="232" y="462" width="700" height="56" fill="#FBEEEB" stroke="#EBC9C0" stroke-width="1" rx="6"/></g></g><g id="layer-text"><text x="550" y="34" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2D3142" letter-spacing="1.2">THE CAGE IS SLOWER THAN WHAT IT CAGES</text><text x="550" y="54" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#999">the rollback ladder against the Commander tick it exists to catch</text><text x="232" y="92" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">0s</text><text x="364" y="92" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">30s</text><text x="496" y="92" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">60s</text><text x="628" y="92" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">90s</text><text x="760" y="92" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">120s</text><text x="892" y="92" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">150s</text><text x="218" y="130" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">Commander acts</text><text x="218" y="144" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">every 60 seconds</text><text x="364" y="131" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFF">60s tick</text><text x="218" y="184" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">What the numbers read as</text><text x="218" y="198" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">sustain window alone</text><text x="308" y="185" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">15s — against a 60s tick, a four-fold margin</text><text x="218" y="232" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="700" fill="#9BA0B2" letter-spacing="0.5">WHAT ACTUALLY HAPPENS</text><text x="218" y="260" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">P0</text><text x="218" y="274" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">1.2× SLO / 15s</text><text x="430" y="261" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#FFF">p99 is 60–120s stale</text><text x="704" y="261" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#C05A45">105s before it can fire</text><text x="218" y="312" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">P1</text><text x="218" y="326" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">1.3× SLO / 30s</text><text x="430" y="313" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#FFF">p99 is 60–120s stale</text><text x="770" y="313" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#C05A45">120s before it can fire</text><text x="218" y="364" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">P2 / P3</text><text x="218" y="378" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">1.5× SLO / 45s</text><text x="430" y="365" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#FFF">p99 is 60–120s stale</text><text x="836" y="365" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#C05A45">135s before it can fire</text><text x="694" y="416" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#C05A45">the agent has acted once more by 120s, twice by 180s</text><text x="582" y="486" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#8C4436">The guardrail reads the same telemetry table the agent does.</text><text x="582" y="504" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#A8695B">A safety layer that shares its subject’s blind spot is not a second opinion.</text></g></svg>
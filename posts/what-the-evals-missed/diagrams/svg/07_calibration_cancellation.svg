ight="81" fill="#8A5FA4" rx="3" opacity="0.9"/><rect x="254.28571428571428" y="190.75" width="62" height="209.25" fill="#C05A45" rx="3" opacity="0.9"/><rect x="347.42857142857144" y="238" width="62" height="162" fill="#C05A45" rx="3" opacity="0.9"/><rect x="440.57142857142856" y="271.75" width="62" height="128.25" fill="#5FA384" rx="3" opacity="0.9"/><rect x="533.7142857142857" y="258.25" width="62" height="141.75" fill="#5FA384" rx="3" opacity="0.9"/><rect x="626.8571428571428" y="312.25" width="62" height="87.75" fill="#8A5FA4" rx="3" opacity="0.9"/><g filter="url(#shadow-light)"><rect x="812" y="132" width="200" height="96" fill="#FFFFFF" stroke="#D6E5DC" stroke-width="1.4" rx="8"/></g><rect x="832" y="318" width="14" height="14" fill="#C05A45" rx="3"/><rect x="832" y="340" width="14" height="14" fill="#8A5FA4" rx="3"/><rect x="832" y="362" width="14" height="14" fill="#5FA384" rx="3"/><g filter="url(#shadow)"><rect x="812" y="396" width="200" height="74" fill="#FBEEEB" stroke="#EBC9C0" stroke-width="1" rx="6"/></g></g><g id="layer-text"><text x="550" y="34" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2D3142" letter-spacing="1.2">THE ERRORS CANCELLED. THE NUMBER LOOKED FINE.</text><text x="550" y="54" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#999">how often the p80 forecast was actually exceeded, by time-of-day slice</text><text x="714" y="257" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="600" fill="#7A8AA5">target 20%</text><text x="119" y="404" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">0%</text><text x="119" y="336.5" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">10%</text><text x="119" y="269" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">20%</text><text x="119" y="201.5" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">30%</text><text x="119" y="134" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">40%</text><text x="192.14285714285714" y="311" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#8A5FA4">12%</text><text x="192.14285714285714" y="418" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">00–04</text><text x="192.14285714285714" y="432" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8" font-weight="400" fill="#A6ADBD">intervals too wide</text><text x="285.2857142857143" y="182.75" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#C05A45">31%</text><text x="285.2857142857143" y="418" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">04–08</text><text x="285.2857142857143" y="432" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8" font-weight="400" fill="#A6ADBD">ramp — too narrow</text><text x="378.42857142857144" y="230" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#C05A45">24%</text><text x="378.42857142857144" y="418" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">08–12</text><text x="471.57142857142856" y="263.75" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#5FA384">19%</text><text x="471.57142857142856" y="418" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">12–16</text><text x="564.7142857142857" y="250.25" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#5FA384">21%</text><text x="564.7142857142857" y="418" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">16–20</text><text x="657.8571428571428" y="304.25" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#8A5FA4">13%</text><text x="657.8571428571428" y="418" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">20–24</text><text x="425" y="452" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">Slice values illustrative. The shape is the point: the two errors have opposite sign.</text><text x="1024" y="100" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="600" fill="#9BA0B2" letter-spacing="0.6" opacity="0.75">THE NUMBER I TRUSTED</text><text x="912" y="172" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="30" font-weight="700" fill="#5FA384">20%</text><text x="912" y="194" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">aggregate exceedance</text><text x="912" y="212" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#5FA384" letter-spacing="1">ON TARGET</text><text x="912" y="280" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5A6478">One number, averaged over</text><text x="912" y="296" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5A6478">a population with structure.</text><text x="856" y="330" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">overconfident</text><text x="856" y="352" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">underconfident</text><text x="856" y="374" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">on target</text><text x="912" y="420" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8C4436">The Commander got its</text><text x="912" y="435" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8C4436">least honest uncertainty</text><text x="912" y="450" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#8C4436">exactly when it mattered.</text><text x="550" y="512" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="500" fill="#999">An aggregate over a heterogeneous population can be right in a way that guarantees it is lying</text></g></svg>
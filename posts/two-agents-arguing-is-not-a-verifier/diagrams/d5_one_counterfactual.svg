<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740"><rect x="0" y="0" width="1000" height="740" fill="#ffffff" rx="18"/><text x="56" y="64" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="31" font-weight="700" fill="#2D3142">Only one reviewer removed the suspect</text><text x="56" y="98" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="22" font-weight="400" fill="#737A8C">two AI agent reviewers in the audit of my options system, July 2026</text><rect x="300" y="150" width="400" height="64" fill="#F2F4F8" rx="12" stroke="#C6CDDA" stroke-width="1.5"/><text x="500" y="178" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="700" fill="#2D3142">the pricing code and the data</text><text x="500" y="202" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#737A8C">both reviewers could read it and run code against it</text><line x1="66" y1="238" x2="66" y2="260.4" stroke="#737A8C" stroke-width="1.5" stroke-linecap="round"/><path d="M 66,266 L 61.71338564016802,259.2453765959839 L 70.28661435983197,259.2453765959839 Z" fill="#737A8C"/><text x="56" y="290" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#737A8C" letter-spacing="2">ENVIRONMENT REVIEWER</text><text x="56" y="322" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="13" font-weight="700" fill="#737A8C" letter-spacing="1.5">ASKED</text><text x="56" y="350" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="600" fill="#2D3142">Zero index prices were</text><text x="56" y="378" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="600" fill="#2D3142">patched in one path. Does</text><text x="56" y="406" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="600" fill="#2D3142">that interact with other code?</text><text x="56" y="440" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="13" font-weight="700" fill="#737A8C" letter-spacing="1.5">DID</text><text x="56" y="468" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5A6478">read the same fallback;</text><text x="56" y="496" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5A6478">ran its probes on other paths</text><rect x="56" y="526" width="424" height="76" fill="#FBEAE5" rx="14" stroke="#C05A45" stroke-width="1.2"/><text x="78" y="564" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="24" font-weight="700" fill="#C05A45">verified correct</text><text x="78" y="588" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#737A8C">the defect passed</text><line x1="530" y1="238" x2="530" y2="260.4" stroke="#737A8C" stroke-width="1.5" stroke-linecap="round"/><path d="M 530,266 L 525.713385640168,259.2453765959839 L 534.286614359832,259.2453765959839 Z" fill="#737A8C"/><text x="520" y="290" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#2D3142" letter-spacing="2">SKEPTIC</text><text x="520" y="322" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="13" font-weight="700" fill="#737A8C" letter-spacing="1.5">ASKED</text><text x="520" y="350" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="600" fill="#2D3142">What single bug would most</text><text x="520" y="378" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="600" fill="#2D3142">cheaply explain the 163%?</text><text x="520" y="440" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="13" font-weight="700" fill="#737A8C" letter-spacing="1.5">DID</text><text x="520" y="468" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5A6478">disabled the suspect code;</text><text x="520" y="496" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="400" fill="#5A6478">reran one 2025 test</text><rect x="520" y="526" width="424" height="76" fill="#E4F1EA" rx="14" stroke="#5FA384" stroke-width="1.2"/><text x="542" y="564" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="24" font-weight="700" fill="#5FA384">+287.5% → -0.5%</text><text x="542" y="588" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="16" font-weight="400" fill="#737A8C">the defect found</text><line x1="500" y1="214" x2="500" y2="238" stroke="#737A8C" stroke-width="1.5"/><line x1="66" y1="238" x2="530" y2="238" stroke="#737A8C" stroke-width="1.5"/><line x1="500" y1="282" x2="500" y2="602" stroke="#E2E5EC" stroke-width="1.5" stroke-dasharray="6 8"/><line x1="56" y1="638" x2="944" y2="638" stroke="#C6CDDA" stroke-width="1.5"/><text x="56" y="672" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#737A8C">The skeptic ran the measurement with the suspect code removed. From the audit files</text><text x="56" y="700" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#737A8C">of the options project; the system never traded real capital.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><rect x="0" y="0" width="1000" height="700" fill="#ffffff" rx="18"/><text x="56" y="64" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="31" font-weight="700" fill="#2D3142">Two configurations, one paper</text><text x="56" y="98" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="22" font-weight="400" fill="#737A8C">Khan et al. (ICML 2024): the cited result, and the one in its own appendix</text><text x="56" y="150" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#5FA384" letter-spacing="2">THE CITED RESULT</text><text x="56" y="186" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="25" font-weight="700" fill="#2D3142">Judge cannot see the passage</text><circle cx="62" cy="225" r="4" fill="#9BA0B2"/><text x="82" y="232" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#5A6478">Debaters hold a story of about 8,000 tokens</text><circle cx="62" cy="265" r="4" fill="#9BA0B2"/><text x="82" y="272" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#5A6478">Judge is denied it</text><circle cx="62" cy="305" r="4" fill="#9BA0B2"/><text x="82" y="312" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#5A6478">Quotes machine-verified against the text</text><circle cx="62" cy="345" r="4" fill="#9BA0B2"/><text x="82" y="352" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#5A6478">Best-of-16 GPT-4-Turbo debaters</text><rect x="56" y="410" width="424" height="118" fill="#E4F1EA" rx="14" stroke="#5FA384" stroke-width="1.2"/><text x="78" y="452" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="22" font-weight="700" fill="#5FA384">Human judges  60% → 88%</text><text x="78" y="484" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="22" font-weight="700" fill="#5FA384">GPT-4-Turbo judges  48% → 76%</text><text x="78" y="510" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="18" font-weight="400" fill="#737A8C">on QuALITY</text><text x="520" y="150" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#C05A45" letter-spacing="2">APPENDIX C.2</text><text x="520" y="186" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="25" font-weight="700" fill="#2D3142">Judge has what the debaters have</text><circle cx="526" cy="225" r="4" fill="#9BA0B2"/><text x="546" y="232" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#5A6478">No information asymmetry</text><circle cx="526" cy="265" r="4" fill="#9BA0B2"/><text x="546" y="272" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#5A6478">No capability asymmetry</text><circle cx="526" cy="305" r="4" fill="#9BA0B2"/><text x="546" y="312" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#5A6478">GPT-4 debaters, GPT-4 judge</text><circle cx="526" cy="345" r="4" fill="#9BA0B2"/><text x="546" y="352" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#5A6478">The authors’ earlier exploratory work</text><rect x="520" y="410" width="424" height="118" fill="#FBEAE5" rx="14" stroke="#C05A45" stroke-width="1.2"/><text x="542" y="452" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="22" font-weight="700" fill="#C05A45">Below the best single-model</text><text x="542" y="484" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="22" font-weight="700" fill="#C05A45">baseline on 9 of 10 benchmarks</text><text x="542" y="510" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="18" font-weight="400" fill="#737A8C">TruthfulQA the sole exception</text><line x1="500" y1="150" x2="500" y2="528" stroke="#E2E5EC" stroke-width="1.5" stroke-dasharray="6 8"/><line x1="56" y1="570" x2="944" y2="570" stroke="#C6CDDA" stroke-width="1.5"/><text x="56" y="604" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#737A8C">QuALITY on the left and 10 MMLU-class benchmarks on the right, so this contrasts two setups</text><text x="56" y="632" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#737A8C">and is not an ablation. Inference time only, with no debate training, on benchmarks where</text><text x="56" y="660" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#737A8C">the judge already scored above 70% alone.</text></svg>
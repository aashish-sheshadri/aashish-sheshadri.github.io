<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="552" viewBox="0 0 1000 552"><rect x="0" y="0" width="1000" height="552" fill="#ffffff" rx="18"/><text x="56" y="64" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="31" font-weight="700" fill="#2D3142">Three agents, the same code</text><text x="56" y="98" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="22" font-weight="400" fill="#737A8C">a test whose result depended on the time of day</text><rect x="56" y="213" width="240" height="96" fill="#F4F5F8" rx="14" stroke="#C6CDDA" stroke-width="1.5"/><text x="176" y="253" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="24" font-weight="700" fill="#2D3142" letter-spacing="1.5">SAME CODE</text><text x="176" y="283" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="400" fill="#737A8C">verified identical</text><line x1="302" y1="261" x2="389.9532055999729" y2="176.87084681741723" stroke="#737A8C" stroke-width="1.5" stroke-linecap="round"/><path d="M 394,173 L 392.08183131903326,180.7666356237021 L 386.1558214789437,174.57126169997213 Z" fill="#737A8C"/><rect x="402" y="138" width="542" height="70" fill="#ffffff" rx="12" stroke="#E2E5EC" stroke-width="1.5"/><text x="424" y="169" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="24" font-weight="600" fill="#2D3142">Implementer</text><text x="424" y="197" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="400" fill="#737A8C">ran the full suite, 1 test failed</text><rect x="790" y="154" width="136" height="38" fill="#FBEAE5" rx="19" stroke="#C05A45" stroke-width="1.2"/><circle cx="814" cy="173" r="6" fill="#C05A45"/><text x="830" y="181" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="700" fill="#C05A45">failed</text><line x1="302" y1="261" x2="388.4" y2="261" stroke="#737A8C" stroke-width="1.5" stroke-linecap="round"/><path d="M 394,261 L 387.2453765959839,265.28661435983196 L 387.2453765959839,256.71338564016804 Z" fill="#737A8C"/><rect x="402" y="226" width="542" height="70" fill="#ffffff" rx="12" stroke="#E2E5EC" stroke-width="1.5"/><text x="424" y="257" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="24" font-weight="600" fill="#2D3142">Reviewer</text><text x="424" y="285" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="400" fill="#737A8C">a separate run, same code</text><rect x="790" y="242" width="136" height="38" fill="#FBEAE5" rx="19" stroke="#C05A45" stroke-width="1.2"/><circle cx="814" cy="261" r="6" fill="#C05A45"/><text x="830" y="269" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="700" fill="#C05A45">failed</text><line x1="302" y1="261" x2="389.9532055999729" y2="345.12915318258274" stroke="#737A8C" stroke-width="1.5" stroke-linecap="round"/><path d="M 394,349 L 386.1558214789437,347.4287383000279 L 392.08183131903326,341.2333643762979 Z" fill="#737A8C"/><rect x="402" y="314" width="542" height="70" fill="#ffffff" rx="12" stroke="#E2E5EC" stroke-width="1.5"/><text x="424" y="345" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="24" font-weight="600" fill="#2D3142">Diagnosing agent</text><text x="424" y="373" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="400" fill="#737A8C">ran it just after midnight</text><rect x="790" y="330" width="136" height="38" fill="#E4F1EA" rx="19" stroke="#5FA384" stroke-width="1.2"/><circle cx="814" cy="349" r="6" fill="#5FA384"/><text x="830" y="357" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="700" fill="#5FA384">passed</text><rect x="56" y="418" width="888" height="86" fill="#FBEAE5" rx="14"/><text x="80" y="454" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#C05A45" letter-spacing="2">THE CAUSE</text><text x="80" y="478" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="22" font-weight="500" fill="#2D3142">the test read the clock, so the result depended on when the suite ran.</text></svg>
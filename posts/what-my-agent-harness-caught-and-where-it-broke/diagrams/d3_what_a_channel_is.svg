<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580"><rect x="0" y="0" width="1000" height="580" fill="#ffffff" rx="18"/><text x="56" y="64" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="31" font-weight="700" fill="#2D3142">What a channel is</text><text x="56" y="98" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="22" font-weight="400" fill="#737A8C">the same loop, differing only in what decides the verdict</text><line x1="500" y1="130" x2="500" y2="560" stroke="#E2E5EC" stroke-width="1.5" stroke-dasharray="6 8"/><text x="267" y="156" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="700" fill="#C05A45" letter-spacing="2.5">NO CHANNEL</text><rect x="75" y="210" width="150" height="58" fill="#E3EDFA" rx="12" stroke="#3B7DD8" stroke-width="1.5"/><text x="150" y="246" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="600" fill="#2A5FA4">proposer</text><rect x="309" y="210" width="150" height="58" fill="#EDE6F2" rx="12" stroke="#8A5FA4" stroke-width="1.5"/><text x="384" y="246" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="600" fill="#6B4280">critic</text><path d="M 231,222 Q 267,196 299,222" fill="none" stroke="#5A6478" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 301,222 L 293.1417019941705,223.4990505166858 L 296.29771798166024,215.52786404500043 Z" fill="#5A6478"/><path d="M 303,256 Q 267,282 235,256" fill="none" stroke="#5A6478" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 233,256 L 237.7022820183398,249.52786404500043 L 240.8582980058295,257.4990505166858 Z" fill="#5A6478"/><text x="267" y="188" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="17" font-weight="400" fill="#737A8C" letter-spacing="1">models</text><line x1="267" y1="292" x2="267" y2="307.7" stroke="#5A6478" stroke-width="2" stroke-linecap="round"/><path d="M 267,314 L 262.177558845189,306.4010486704819 L 271.822441154811,306.4010486704819 Z" fill="#5A6478"/><text x="267" y="334" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="17" font-weight="400" fill="#737A8C" letter-spacing="0.5">still a model</text><rect x="127" y="344" width="280" height="76" fill="#EDE6F2" rx="12" stroke="#8A5FA4" stroke-width="1.5"/><text x="267" y="389" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="600" fill="#6B4280">judge: another model</text><line x1="267" y1="434" x2="267" y2="465.7" stroke="#5A6478" stroke-width="2" stroke-linecap="round"/><path d="M 267,472 L 262.177558845189,464.4010486704819 L 271.822441154811,464.4010486704819 Z" fill="#5A6478"/><text x="267" y="506" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="700" fill="#C05A45">verdict = the most plausible answer</text><text x="267" y="534" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="18" font-weight="400" fill="#737A8C">decided inside the loop</text><text x="733" y="156" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="700" fill="#5FA384" letter-spacing="2.5">ONE CHANNEL</text><rect x="541" y="210" width="150" height="58" fill="#E3EDFA" rx="12" stroke="#3B7DD8" stroke-width="1.5"/><text x="616" y="246" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="600" fill="#2A5FA4">proposer</text><rect x="775" y="210" width="150" height="58" fill="#EDE6F2" rx="12" stroke="#8A5FA4" stroke-width="1.5"/><text x="850" y="246" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="600" fill="#6B4280">critic</text><path d="M 697,222 Q 733,196 765,222" fill="none" stroke="#5A6478" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 767,222 L 759.1417019941705,223.4990505166858 L 762.2977179816602,215.52786404500043 Z" fill="#5A6478"/><path d="M 769,256 Q 733,282 701,256" fill="none" stroke="#5A6478" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 699,256 L 703.7022820183398,249.52786404500043 L 706.8582980058295,257.4990505166858 Z" fill="#5A6478"/><text x="733" y="188" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="17" font-weight="400" fill="#737A8C" letter-spacing="1">models</text><line x1="733" y1="292" x2="733" y2="307.7" stroke="#5A6478" stroke-width="2" stroke-linecap="round"/><path d="M 733,314 L 728.177558845189,306.4010486704819 L 737.8224411548109,306.4010486704819 Z" fill="#5A6478"/><text x="733" y="334" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="17" font-weight="400" fill="#737A8C" letter-spacing="0.5">deterministic, not a model</text><rect x="573" y="344" width="320" height="76" fill="#2D3142"/><text x="733" y="376" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">execution · an instrument</text><text x="733" y="402" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="20" font-weight="600" fill="#ffffff">a threshold fixed in advance</text><line x1="733" y1="434" x2="733" y2="465.7" stroke="#5A6478" stroke-width="2" stroke-linecap="round"/><path d="M 733,472 L 728.177558845189,464.4010486704819 L 737.8224411548109,464.4010486704819 Z" fill="#5A6478"/><text x="733" y="506" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="21" font-weight="700" fill="#5FA384">verdict = what the world returned</text><text x="733" y="534" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="18" font-weight="400" fill="#737A8C">decided outside the loop</text></svg>
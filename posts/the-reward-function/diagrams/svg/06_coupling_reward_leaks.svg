="0.65"/><g filter="url(#shadow)"><rect x="418" y="438" width="104" height="52" fill="#FBEEEB" stroke="#EBC9C0" stroke-width="1" rx="6"/></g><g filter="url(#shadow)"><rect x="628" y="438" width="104" height="52" fill="#FBEEEB" stroke="#EBC9C0" stroke-width="1" rx="6"/></g><g filter="url(#shadow-light)"><rect x="838" y="438" width="104" height="52" fill="#FFFFFF" stroke="#E4E7EE" stroke-width="1" rx="6"/></g></g><g id="layer-text"><text x="550" y="34" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2D3142" letter-spacing="1.2">WHERE THE COUPLING TERM LEAKED, TWICE</text><text x="550" y="54" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#999">the same three allocations, scored by each version of commander_directive_alignment</text><text x="232" y="92" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="700" fill="#9BA0B2" letter-spacing="0.6">WHAT THE SOLDIER ACTUALLY ALLOCATED</text><text x="470" y="86" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#8A5FA4">v1 · cosine only</text><text x="470" y="100" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">direction, no magnitude</text><text x="680" y="86" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#8A5FA4">v2 · + asymmetric ratio</text><text x="680" y="100" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">penalizes under-spend only</text><text x="890" y="86" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#8A5FA4">v3 · + symmetric ratio</text><text x="890" y="100" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">penalizes both directions</text><text x="76" y="148" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2D3142">MATCHED</text><text x="76" y="164" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">same shape, same total</text><text x="236" y="185" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8" font-weight="400" fill="#B9C0CE">intended</text><text x="470" y="190" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="700" fill="#5FA384">1.00</text><text x="680" y="190" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="700" fill="#5FA384">1.00</text><text x="890" y="190" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="700" fill="#5FA384">1.00</text><text x="76" y="286" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2D3142">HALF SCALE</text><text x="76" y="302" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">same shape, half the total</text><text x="236" y="323" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8" font-weight="400" fill="#B9C0CE">intended</text><text x="470" y="328" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="700" fill="#C05A45">1.00</text><text x="470" y="345" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8" font-weight="600" fill="#C05A45">full credit, wrong</text><text x="680" y="328" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="700" fill="#5FA384">0.50</text><text x="890" y="328" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="700" fill="#5FA384">0.50</text><text x="76" y="424" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2D3142">OVER-PROVISIONED</text><text x="76" y="440" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">same shape, +10% — all the cap allows</text><text x="236" y="461" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8" font-weight="400" fill="#B9C0CE">intended</text><text x="470" y="466" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="700" fill="#C05A45">1.00</text><text x="470" y="483" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8" font-weight="600" fill="#C05A45">full credit, wrong</text><text x="680" y="466" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="700" fill="#C05A45">1.00</text><text x="680" y="483" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8" font-weight="600" fill="#C05A45">full credit, wrong</text><text x="890" y="466" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="19" font-weight="700" fill="#5FA384">0.90</text><text x="470" y="542" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">scale-invariant: half the cluster,</text><text x="470" y="556" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">perfect alignment score</text><text x="680" y="542" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">over-provisioning is free, right</text><text x="680" y="556" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">up to the 10% hard cap</text><text x="890" y="542" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="600" fill="#5FA384">both directions now cost something —</text><text x="890" y="556" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#8A93A8">though the cap makes over-spend the cheaper sin</text></g></svg>
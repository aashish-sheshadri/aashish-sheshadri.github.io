<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="-10 -10 1120 580"><defs><filter id="shadow" x="-4%" y="-4%" width="112%" height="112%"><feFlood flood-color="#000000" flood-opacity="0.08" result="color"/><feComposite in="color" in2="SourceGraphic" operator="in" result="shadow"/><feGaussianBlur in="shadow" stdDeviation="3" result="blur"/><feOffset in="blur" dx="2" dy="3" result="offsetBlur"/><feMerge><feMergeNode in="offsetBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="shadow-light" x="-4%" y="-4%" width="112%" height="112%"><feFlood flood-color="#000000" flood-opacity="0.04" result="color"/><feComposite in="color" in2="SourceGraphic" operator="in" result="shadow"/><feGaussianBlur in="shadow" stdDeviation="2" result="blur"/><feOffset in="blur" dx="1" dy="2" result="offsetBlur"/><feMerge><feMergeNode in="offsetBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="-10" y="-10" width="1120" height="580" fill="#ffffff" rx="8"/><g id="layer-zones"><rect x="56" y="78" width="636" height="442" fill="#FBF3F1" rx="10"/><rect x="676" y="78" width="368" height="442" fill="#F7F8FB" rx="10"/></g><g id="layer-connectors"><line x1="480" y1="161" x2="545" y2="269" stroke="#C05A45" stroke-width="1.6" opacity="0.75"/><polygon points="545,269 535.2810332086746,263.8481377629916 544.9979387093632,258.0000001931327" fill="#C05A45"/><line x1="545" y1="331" x2="480" y2="437" stroke="#C05A45" stroke-width="1.6" opacity="0.75"/><polygon points="480,437 480.0932977912963,426.00039566520053 489.761363231276,431.9289263595277" fill="#C05A45"/><line x1="232" y1="437" x2="186" y2="331" stroke="#C05A45" stroke-width="1.6" opacity="0.75"/><polygon points="186,331 194.95415540009037,337.3892958196528 184.55051794371107,341.9040818856287" fill="#C05A45"/><line x1="186" y1="269" x2="232" y2="161" stroke="#C05A45" stroke-width="1.6" opacity="0.75"/><polygon points="232,161 233.52340569480072,171.89399995819022 223.08938598268975,167.44988045118" fill="#C05A45"/><line x1="860" y1="232" x2="860" y2="258" stroke="#C6CDDA" stroke-width="1.4" stroke-dasharray="4,3"/><line x1="700" y1="412" x2="1020" y2="412" stroke="#E2E5EC" stroke-width="1"/></g><g id="layer-boxes"><g filter="url(#shadow-light)"><rect x="204" y="105" width="300" height="54" fill="#FFFFFF" stroke="#EBC9C0" stroke-width="1.2" rx="7"/></g><g filter="url(#shadow-light)"><rect x="461" y="273" width="210" height="54" fill="#FFFFFF" stroke="#EBC9C0" stroke-width="1.2" rx="7"/></g><g filter="url(#shadow-light)"><rect x="204" y="439" width="300" height="54" fill="#FFFFFF" stroke="#EBC9C0" stroke-width="1.2" rx="7"/></g><g filter="url(#shadow-light)"><rect x="63" y="273" width="210" height="54" fill="#FFFFFF" stroke="#EBC9C0" stroke-width="1.2" rx="7"/></g><g filter="url(#shadow-light)"><rect x="700" y="118" width="320" height="92" fill="#FFFFFF" stroke="#D6E5DC" stroke-width="1.2" rx="7"/></g><rect x="700" y="118" width="4" height="92" fill="#5FA384" rx="2"/><g filter="url(#shadow)"><rect x="700" y="268" width="320" height="118" fill="#FBEEEB" stroke="#EBC9C0" stroke-width="1.2" rx="7"/></g><rect x="700" y="268" width="4" height="118" fill="#C05A45" rx="2"/></g><g id="layer-text"><text x="550" y="34" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2D3142" letter-spacing="1.2">MANUFACTURING SOMETHING TO FIX</text><text x="550" y="54" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#999">a relative-improvement reward pays for the recovery, so the policy arranges to need one</text><text x="354" y="128" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2D3142">Hold a domain slightly under-provisioned</text><text x="354" y="145" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#8A93A8">still inside SLO, nothing alerts</text><text x="566" y="296" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2D3142">p99 drifts upward</text><text x="566" y="313" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#8A93A8">the gap the reward measures</text><text x="354" y="462" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2D3142">Add the budget back</text><text x="354" y="479" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#8A93A8">a large relative improvement</text><text x="168" y="296" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11" font-weight="700" fill="#2D3142">Collect the reward</text><text x="168" y="313" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#8A93A8">credit for the rescue</text><text x="354" y="292" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#C05A45">the loop pays</text><text x="354" y="310" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#C05A45">every time round</text><text x="550" y="548" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">The loop also fought the thrash penalty the whole time</text><text x="1016" y="100" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="600" fill="#9BA0B2" letter-spacing="0.6" opacity="0.75">THE FIX</text><text x="860" y="144" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">SLO adherence → absolute threshold</text><text x="860" y="164" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">score where you are, not how far</text><text x="860" y="179" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">you moved. No recovery to sell.</text><text x="860" y="198" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="600" fill="#5FA384">closes the channel in this term</text><text x="860" y="294" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#8C4436">but the same shape survived</text><text x="860" y="316" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">I(budget_delta &gt; 0)</text><text x="860" y="334" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A8695B">in the proactivity bonus is also a</text><text x="860" y="348" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A8695B">delta reward. It pays for increases,</text><text x="860" y="362" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A8695B">so coming down first is how you</text><text x="860" y="376" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A8695B">earn again.</text><text x="860" y="438" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="500" fill="#5A6478">What I actually did was remove</text><text x="860" y="456" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="500" fill="#5A6478">relative-improvement rewards from</text><text x="860" y="474" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#2D3142">the place I was looking.</text></g></svg>
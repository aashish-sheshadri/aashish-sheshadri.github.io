5" width="68" height="22" fill="#FFFFFF" stroke="#2A5FA4" stroke-width="1.2" rx="5"/><rect x="296" y="465" width="68" height="22" fill="#E4E7EE" rx="5"/><rect x="414" y="465" width="68" height="22" fill="#E4E7EE" rx="5"/><rect x="532" y="465" width="68" height="22" fill="#FBEEEB" stroke="#C05A45" stroke-width="1.2" rx="5"/><rect x="650" y="465" width="68" height="22" fill="#2A5FA4" rx="5" opacity="0.9"/><rect x="768" y="465" width="68" height="22" fill="#FFFFFF" stroke="#2A5FA4" stroke-width="1.2" rx="5"/><rect x="886" y="465" width="68" height="22" fill="#FFFFFF" stroke="#2A5FA4" stroke-width="1.2" rx="5"/><g filter="url(#shadow)"><rect x="356" y="524" width="420" height="46" fill="#FBEEEB" stroke="#EBC9C0" stroke-width="1" rx="6"/></g><rect x="76" y="528" width="22" height="12" fill="#2E8B8B" rx="3" opacity="0.9"/><rect x="102" y="528" width="22" height="12" fill="#2A5FA4" rx="3" opacity="0.9"/><rect x="76" y="548" width="22" height="12" fill="#FFFFFF" stroke="#7A8296" stroke-width="1.2" rx="3"/><rect x="76" y="568" width="22" height="12" fill="#E4E7EE" rx="3"/></g><g id="layer-text"><text x="550" y="34" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2D3142" letter-spacing="1.2">WHICH REWARD TERMS ARE LIVE, AND WHEN</text><text x="550" y="54" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#999">terms arrive on a curriculum — a term that is not live yet is a behavior that is free</text><text x="330" y="98" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#5A6478" letter-spacing="0.5">STAGE 1</text><text x="330" y="113" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">forecaster</text><text x="448" y="98" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#5A6478" letter-spacing="0.5">STAGE 2</text><text x="448" y="113" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">soldiers</text><text x="566" y="98" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#5A6478" letter-spacing="0.5">STAGE 3</text><text x="566" y="113" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">commander</text><text x="684" y="98" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#5A6478" letter-spacing="0.5">STAGE 4</text><text x="684" y="113" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">joint</text><text x="802" y="98" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#B0B6C4" letter-spacing="0.5">STAGE 5</text><text x="802" y="113" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">shadow</text><text x="920" y="98" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="700" fill="#B0B6C4" letter-spacing="0.5">STAGE 6</text><text x="920" y="113" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">canary</text><text x="76" y="150" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#2E8B8B" letter-spacing="0.7">SOLDIER</text><text x="76" y="176" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">v_slo</text><text x="162" y="176" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">domain SLO adherence</text><text x="76" y="206" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">v_align</text><text x="162" y="206" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">directive alignment</text><text x="76" y="236" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">v_bgt</text><text x="162" y="236" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">budget utilization deviation</text><text x="76" y="266" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">v_osc ≈ v_cold</text><text x="162" y="266" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">oscillation, cold start</text><text x="76" y="302" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#2A5FA4" letter-spacing="0.7">COMMANDER</text><text x="76" y="328" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">w_slo</text><text x="162" y="328" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">cluster SLO adherence</text><text x="76" y="358" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">w_deg</text><text x="162" y="358" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">worst-domain degradation</text><text x="76" y="388" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">w_cost</text><text x="162" y="388" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">absolute cluster cost</text><text x="76" y="418" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">w_thr</text><text x="162" y="418" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">node provisioner thrash</text><text x="76" y="448" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">w_pro</text><text x="162" y="448" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">forecast proactivity bonus</text><text x="76" y="478" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2D3142">w_flr</text><text x="162" y="478" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">floor proximity penalty</text><text x="566" y="479" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#C05A45">absent</text><text x="566" y="544" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="600" fill="#8C4436">For the whole of Stage 3 there is no penalty for driving a domain to its floor.</text><text x="566" y="560" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#A8695B">Episode 1 is not the policy being clever. It is this gap.</text><text x="132" y="538" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">live and training  (teal Soldier, blue Commander)</text><text x="132" y="558" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">live, but the policy is frozen</text><text x="132" y="578" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">not yet introduced</text></g></svg>
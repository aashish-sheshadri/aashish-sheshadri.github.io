<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="-10 -10 1120 640"><defs><filter id="shadow" x="-4%" y="-4%" width="112%" height="112%"><feFlood flood-color="#000000" flood-opacity="0.08" result="color"/><feComposite in="color" in2="SourceGraphic" operator="in" result="shadow"/><feGaussianBlur in="shadow" stdDeviation="3" result="blur"/><feOffset in="blur" dx="2" dy="3" result="offsetBlur"/><feMerge><feMergeNode in="offsetBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="shadow-light" x="-4%" y="-4%" width="112%" height="112%"><feFlood flood-color="#000000" flood-opacity="0.04" result="color"/><feComposite in="color" in2="SourceGraphic" operator="in" result="shadow"/><feGaussianBlur in="shadow" stdDeviation="2" result="blur"/><feOffset in="blur" dx="1" dy="2" result="offsetBlur"/><feMerge><feMergeNode in="offsetBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="-10" y="-10" width="1120" height="640" fill="#ffffff" rx="8"/><g id="layer-zones"><rect x="56" y="76" width="480" height="230" fill="#E8F5F5" rx="10"/><rect x="56" y="326" width="480" height="166" fill="#F0E9F7" rx="10"/><rect x="566" y="76" width="200" height="416" fill="#F4EFFA" rx="10"/><rect x="796" y="76" width="248" height="416" fill="#F7F8FB" rx="10"/></g><g id="layer-connectors"><line x1="520" y1="387" x2="556" y2="387" stroke="#8A5FA4" stroke-width="1.6"/><polygon points="562,387 554,383 554,391" fill="#8A5FA4"/><line x1="772" y1="284" x2="812" y2="284" stroke="#8A93A8" stroke-width="1.6"/><polygon points="820,284 810,279 810,289" fill="#8A93A8"/><line x1="584" y1="258" x2="748" y2="258" stroke="#D8CEE8" stroke-width="1" stroke-dasharray="4,3"/><line x1="826" y1="344" x2="1014" y2="344" stroke="#E2E5EC" stroke-width="1"/><line x1="846" y1="404" x2="1000" y2="404" stroke="#C6CDDA" stroke-width="1.5"/><line x1="846" y1="400" x2="846" y2="408" stroke="#C6CDDA" stroke-width="1.2"/><line x1="923" y1="400" x2="923" y2="408" stroke="#C6CDDA" stroke-width="1.2"/><line x1="1000" y1="400" x2="1000" y2="408" stroke="#C6CDDA" stroke-width="1.2"/></g><g id="layer-boxes"><g filter="url(#shadow-light)"><rect x="76" y="110" width="440" height="54" fill="#FFFFFF" stroke="#E4E7EE" stroke-width="1" rx="6"/></g><rect x="76" y="110" width="4" height="54" fill="#2E8B8B" rx="2"/><rect x="92" y="128" width="18" height="18" fill="#5FA384" rx="4"/><g filter="url(#shadow-light)"><rect x="76" y="174" width="440" height="54" fill="#FFFFFF" stroke="#E4E7EE" stroke-width="1" rx="6"/></g><rect x="76" y="174" width="4" height="54" fill="#2E8B8B" rx="2"/><rect x="92" y="192" width="18" height="18" fill="#D4644B" rx="4"/><g filter="url(#shadow-light)"><rect x="76" y="238" width="440" height="54" fill="#FFFFFF" stroke="#E4E7EE" stroke-width="1" rx="6"/></g><rect x="76" y="238" width="4" height="54" fill="#2E8B8B" rx="2"/><rect x="92" y="256" width="18" height="18" fill="#D4644B" rx="4"/><g filter="url(#shadow-light)"><rect x="76" y="360" width="440" height="54" fill="#FFFFFF" stroke="#E4E7EE" stroke-width="1" rx="6"/></g><rect x="76" y="360" width="4" height="54" fill="#8A5FA4" rx="2"/><rect x="92" y="378" width="18" height="18" fill="#5FA384" rx="4"/><g filter="url(#shadow-light)"><rect x="76" y="424" width="440" height="54" fill="#FFFFFF" stroke="#E4E7EE" stroke-width="1" rx="6"/></g><rect x="76" y="424" width="4" height="54" fill="#8A5FA4" rx="2"/><rect x="92" y="442" width="18" height="18" fill="#D4644B" rx="4"/><g filter="url(#shadow)"><rect x="584" y="116" width="164" height="46" fill="#FFF" stroke="#DDD4EA" stroke-width="1" rx="5"/></g><g filter="url(#shadow)"><rect x="584" y="192" width="164" height="46" fill="#FFF" stroke="#DDD4EA" stroke-width="1" rx="5"/></g><rect x="584" y="300" width="164" height="52" fill="#FFF" stroke="#E6DEF0" stroke-width="0.8" rx="4"/><rect x="584" y="362" width="164" height="52" fill="#FFF" stroke="#E6DEF0" stroke-width="0.8" rx="4"/><rect x="584" y="424" width="164" height="52" fill="#FFF" stroke="#E6DEF0" stroke-width="0.8" rx="4"/><g filter="url(#shadow)"><rect x="826" y="120" width="188" height="66" fill="#2D3142" rx="8"/></g><rect x="826" y="208" width="140" height="14" fill="#2E8B8B" rx="3"/><rect x="826" y="236" width="106" height="14" fill="#8A5FA4" rx="3"/><rect x="826" y="264" width="62" height="14" fill="#A97FC0" rx="3"/><rect x="826" y="292" width="26" height="14" fill="#A6ADBD" rx="3"/><rect x="920" y="386" width="6" height="6" fill="#A97FC0" rx="3"/><rect x="997" y="386" width="6" height="6" fill="#8A5FA4" rx="3"/></g><g id="layer-text"><text x="550" y="36" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2D3142" letter-spacing="1.2">THE SOLDIER'S REWARD FUNCTION</text><text x="550" y="56" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#999">five terms — three local to the domain, two coupling it to the Commander</text><text x="516" y="98" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="600" fill="#2E8B8B" letter-spacing="0.6" opacity="0.7">LOCAL TO THE DOMAIN</text><text x="101" y="141" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF">+</text><text x="122" y="134" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">v_slo × domain_slo_adherence</text><text x="122" y="150" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">primary — same concave form as the Commander</text><text x="101" y="205" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF">−</text><text x="122" y="198" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">v_osc × replica_oscillation_penalty</text><text x="122" y="214" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">up-down thrashing inside the domain</text><text x="101" y="269" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF">−</text><text x="122" y="262" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">v_cold × cold_start_penalty</text><text x="122" y="278" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">pods counted as scaled before they serve</text><text x="516" y="348" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="600" fill="#8A5FA4" letter-spacing="0.6" opacity="0.7">COUPLING TO THE COMMANDER</text><text x="101" y="391" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF">+</text><text x="122" y="384" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">v_align × commander_directive_alignment</text><text x="122" y="400" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">following the allocated intent</text><text x="101" y="455" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF">−</text><text x="122" y="448" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">v_bgt × budget_utilization_deviation</text><text x="122" y="464" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">over- or under-spending the allocation</text><text x="296" y="516" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="600" fill="#8A5FA4">The two coupling terms are where every mistake in this post lives.</text><text x="750" y="98" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="600" fill="#8A5FA4" letter-spacing="0.6" opacity="0.75">THE COUPLING TERM</text><text x="666" y="136" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="700" fill="#8A5FA4" letter-spacing="0.5">DIRECTION</text><text x="666" y="152" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5A6478">cos(actual, intended)</text><text x="666" y="180" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#8A5FA4">×</text><text x="666" y="212" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="700" fill="#8A5FA4" letter-spacing="0.5">MAGNITUDE</text><text x="666" y="228" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#5A6478">max(0, 1 − |1 − L1 ratio|)</text><text x="666" y="278" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#9BA0B2" letter-spacing="0.5">THREE CORRECTIONS</text><text x="594" y="316" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#6B4A85">ε in the denominator</text><text x="594" y="330" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#8A93A8">added to both vectors it</text><text x="594" y="342" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#8A93A8">buys free alignment credit</text><text x="594" y="378" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#6B4A85">magnitude clamped at 0</text><text x="594" y="392" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#8A93A8">unclamped past 2× it</text><text x="594" y="404" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#8A93A8">inverts the gradient</text><text x="594" y="440" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#6B4A85">ratio over L1, not L2</text><text x="594" y="454" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#8A93A8">L2 conflates shape</text><text x="594" y="466" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#8A93A8">with total spend</text><text x="1024" y="98" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="600" fill="#9BA0B2" letter-spacing="0.6" opacity="0.75">PRIORITY</text><text x="920" y="148" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFF" letter-spacing="0.4">R_soldier</text><text x="920" y="168" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="rgba(255,255,255,0.6)">every 10s tick</text><text x="975" y="219" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#5A6478">v_slo</text><text x="941" y="247" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#5A6478">v_align</text><text x="897" y="275" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#5A6478">v_bgt</text><text x="861" y="303" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#5A6478">v_osc ≈ v_cold</text><text x="920" y="366" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#C05A45" letter-spacing="0.4">TWO TERMS, OPPOSITE OPTIMA</text><text x="846" y="422" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">70%</text><text x="923" y="422" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">85%</text><text x="1000" y="422" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="400" fill="#A6ADBD">100%</text><text x="923" y="382" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#A97FC0">v_bgt</text><text x="993" y="382" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#8A5FA4">v_align</text><text x="920" y="444" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">v_align &gt; v_bgt, so the 85%</text><text x="920" y="459" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">target is never reached.</text><text x="920" y="474" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#8A93A8">One of the two should move.</text><text x="550" y="584" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="500" fill="#999">The Soldier spends what the Commander allocates — the coupling term is what makes that a preference rather than a rule</text><text x="550" y="601" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#BBB">Five terms  |  two of them coupling  |  one conflict still open</text></g></svg>
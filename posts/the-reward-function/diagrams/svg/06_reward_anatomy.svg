roke-width="1.3" opacity="0.5"/><polygon points="562,451 554,447 554,455" fill="#2E8B8B"/><line x1="520" y1="515" x2="556" y2="515" stroke="#2E8B8B" stroke-width="1.3" opacity="0.5"/><polygon points="562,515 554,511 554,519" fill="#2E8B8B"/><line x1="592" y1="500" x2="720" y2="500" stroke="#C6CDDA" stroke-width="1" stroke-dasharray="4,3"/><line x1="750" y1="192" x2="792" y2="192" stroke="#8A93A8" stroke-width="1.6"/><polygon points="800,192 790,187 790,197" fill="#8A93A8"/><line x1="806" y1="350" x2="1014" y2="350" stroke="#D3D7E0" stroke-width="1" stroke-dasharray="3,3"/><line x1="806" y1="424" x2="1014" y2="424" stroke="#E2E5EC" stroke-width="1"/></g><g id="layer-boxes"><g filter="url(#shadow-light)"><rect x="76" y="110" width="440" height="54" fill="#FFFFFF" stroke="#E4E7EE" stroke-width="1" rx="6"/></g><rect x="76" y="110" width="4" height="54" fill="#2A5FA4" rx="2"/><rect x="92" y="128" width="18" height="18" fill="#5FA384" rx="4"/><g filter="url(#shadow-light)"><rect x="76" y="174" width="440" height="54" fill="#FFFFFF" stroke="#E4E7EE" stroke-width="1" rx="6"/></g><rect x="76" y="174" width="4" height="54" fill="#2A5FA4" rx="2"/><rect x="92" y="192" width="18" height="18" fill="#D4644B" rx="4"/><g filter="url(#shadow-light)"><rect x="76" y="238" width="440" height="54" fill="#FFFFFF" stroke="#E4E7EE" stroke-width="1" rx="6"/></g><rect x="76" y="238" width="4" height="54" fill="#2A5FA4" rx="2"/><rect x="92" y="256" width="18" height="18" fill="#D4644B" rx="4"/><g filter="url(#shadow-light)"><rect x="76" y="360" width="440" height="54" fill="#FFFFFF" stroke="#E4E7EE" stroke-width="1" rx="6"/></g><rect x="76" y="360" width="4" height="54" fill="#2E8B8B" rx="2"/><rect x="92" y="378" width="18" height="18" fill="#D4644B" rx="4"/><g filter="url(#shadow-light)"><rect x="76" y="424" width="440" height="54" fill="#FFFFFF" stroke="#E4E7EE" stroke-width="1" rx="6"/></g><rect x="76" y="424" width="4" height="54" fill="#2E8B8B" rx="2"/><rect x="92" y="442" width="18" height="18" fill="#5FA384" rx="4"/><g filter="url(#shadow-light)"><rect x="76" y="488" width="440" height="54" fill="#FFFFFF" stroke="#E4E7EE" stroke-width="1" rx="6"/></g><rect x="76" y="488" width="4" height="54" fill="#2E8B8B" rx="2"/><rect x="92" y="506" width="18" height="18" fill="#D4644B" rx="4"/><rect x="586" y="146" width="140" height="20" fill="#FFF" stroke="#DDE2EC" stroke-width="0.8" rx="3"/><rect x="586" y="170" width="140" height="20" fill="#FFF" stroke="#DDE2EC" stroke-width="0.8" rx="3"/><rect x="586" y="194" width="140" height="20" fill="#FFF" stroke="#DDE2EC" stroke-width="0.8" rx="3"/><rect x="586" y="218" width="140" height="20" fill="#FFF" stroke="#DDE2EC" stroke-width="0.8" rx="3"/><polygon points="596,268 716,268 672,302 640,302" fill="#CFD6E4"/><g filter="url(#shadow)"><rect x="592" y="392" width="128" height="34" fill="#2D3142" rx="6"/></g><g filter="url(#shadow)"><rect x="806" y="150" width="208" height="84" fill="#2D3142" rx="8"/></g><rect x="806" y="296" width="150" height="15" fill="#2A5FA4" rx="3"/><rect x="806" y="326" width="112" height="15" fill="#3B7DD8" rx="3"/><rect x="806" y="356" width="40" height="15" fill="#5FA384" rx="3"/><rect x="806" y="386" width="20" height="15" fill="#A6ADBD" rx="3"/></g><g id="layer-text"><text x="550" y="36" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="15" font-weight="700" fill="#2D3142" letter-spacing="1.2">THE COMMANDER'S REWARD FUNCTION</text><text x="550" y="56" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#999">six terms, introduced across two curriculum stages</text><text x="516" y="98" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="600" fill="#2A5FA4" letter-spacing="0.6" opacity="0.65">CORE  ·  STAGE 3</text><text x="101" y="141" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF">+</text><text x="122" y="134" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">w_slo × cluster_slo_adherence_score</text><text x="122" y="150" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">primary — SLOs met</text><text x="101" y="205" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF">−</text><text x="122" y="198" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">w_deg × max(weighted_degradation[D])</text><text x="122" y="214" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">worst domain, not the average</text><text x="101" y="269" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF">−</text><text x="122" y="262" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">w_cost × cluster_cost_per_min</text><text x="122" y="278" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">secondary — cost efficiency</text><text x="516" y="348" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="600" fill="#2E8B8B" letter-spacing="0.6" opacity="0.65">SHAPING  ·  ADDED STAGE 4</text><text x="101" y="391" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF">−</text><text x="122" y="384" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">w_thr × node_provisioner_thrash</text><text x="122" y="400" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">node churn penalty</text><text x="101" y="455" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF">+</text><text x="122" y="448" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">w_pro × forecast_proactivity_bonus</text><text x="122" y="464" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">acting before the spike lands</text><text x="101" y="519" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFF">−</text><text x="122" y="512" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#2D3142">w_flr × floor_proximity_penalty</text><text x="122" y="528" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">domain starved at its minimum</text><text x="730" y="98" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="600" fill="#7A8296" letter-spacing="0.6" opacity="0.75">NORMALIZE</text><text x="656" y="132" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#9BA0B2" letter-spacing="0.5">RAW SCALES DIFFER</text><text x="594" y="160" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#5A6478">slo_adherence</text><text x="718" y="160" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">[0, 1]</text><text x="594" y="184" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#5A6478">degradation</text><text x="718" y="184" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">unbounded</text><text x="594" y="208" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#5A6478">cost</text><text x="718" y="208" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">$ / hour</text><text x="594" y="232" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#5A6478">thrash</text><text x="718" y="232" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#A6ADBD">integer</text><text x="656" y="294" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="17" font-weight="700" fill="#4A5168">÷</text><text x="656" y="322" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5A6478">cost ÷ fixed HPA-era reference</text><text x="656" y="341" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5A6478">both SLO terms  clipped at 2× SLO</text><text x="656" y="360" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#5A6478">thrash ÷ max expected rate</text><text x="656" y="414" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFF">every term ≈ [−1, 1]</text><text x="656" y="452" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">the w_ coefficients then</text><text x="656" y="468" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">express relative importance,</text><text x="656" y="484" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">not scale compensation</text><text x="656" y="522" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">Stage 3 trains the core three;</text><text x="656" y="538" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">Stage 4 adds the shaping terms.</text><text x="1024" y="98" text-anchor="end" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="600" fill="#9BA0B2" letter-spacing="0.6" opacity="0.75">AGGREGATE</text><text x="910" y="182" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFF" letter-spacing="0.4">R_commander</text><text x="910" y="202" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="rgba(255,255,255,0.75)">weighted sum</text><text x="910" y="218" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="rgba(255,255,255,0.55)">every 60s tick</text><text x="910" y="274" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#9BA0B2" letter-spacing="0.5">COEFFICIENT PRIORITY</text><text x="965" y="308" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#5A6478">w_slo</text><text x="927" y="338" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#5A6478">w_deg</text><text x="855" y="368" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#5A6478">w_cost</text><text x="835" y="398" text-anchor="start" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="600" fill="#5A6478">w_thr ≈ w_pro ≈ w_flr</text><rect x="890" y="341" width="40" height="18" fill="#F7F8FB" rx="3"/><text x="910" y="355" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="14" font-weight="700" fill="#C05A45">≫</text><text x="910" y="448" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">w_pro carries the weakest signal:</text><text x="910" y="464" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">the outcome lands 15 ticks after</text><text x="910" y="480" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">the action, and GAE attenuates</text><text x="910" y="496" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9.5" font-weight="400" fill="#8A93A8">it by roughly 60%.</text><text x="550" y="584" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="10" font-weight="500" fill="#999">Getting the normalization right took longer than designing the reward terms themselves</text><text x="550" y="601" text-anchor="middle" font-family="Inter, &quot;IBM Plex Sans&quot;, system-ui, sans-serif" font-size="9" font-weight="400" fill="#BBB">Six terms  |  two curriculum stages  |  every term normalized before weighting</text></g></svg>